<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bomi's AI App Store</title>
  <meta name="description" content="바이브 코딩으로 만든 앱들을 앱스토어 형태로 모은 포트폴리오" />
  <style>
    :root {
      --bg: #fbfbfc;
      --fg: #111113;
      --muted: #71717a;
      --border: #e4e4e7;
      --card: #ffffff;
      --secondary: #f4f4f5;
      --primary: #18181b;
      --primary-fg: #ffffff;
      --radius-xl: 32px;
      --shadow-sm: 0 1px 3px rgba(0,0,0,.06);
      --shadow-md: 0 18px 50px rgba(0,0,0,.08);
      --shadow-lg: 0 24px 70px rgba(0,0,0,.12);
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 50% -10%, rgba(24,24,27,.07), transparent 36rem),
        linear-gradient(180deg, #fff 0%, var(--bg) 100%);
      color: var(--fg);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; text-decoration: none; }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    .shell { width: min(1160px, calc(100% - 40px)); margin: 0 auto; padding: 48px 0; }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 28px; }
    .brand { display: inline-flex; align-items: center; gap: 10px; font-weight: 950; letter-spacing: -.03em; }
    .brand-badge { display: grid; place-items: center; width: 38px; height: 38px; border-radius: 13px; background: var(--primary); color: white; box-shadow: var(--shadow-sm); }
    .nav-actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: flex-end; }
    .pill {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      border: 1px solid var(--border); background: rgba(255,255,255,.86); color: var(--muted);
      border-radius: 999px; padding: 9px 15px; font-size: 12px; font-weight: 900;
      letter-spacing: .12em; text-transform: uppercase; box-shadow: var(--shadow-sm);
    }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      border: 1px solid var(--border); border-radius: 999px; padding: 11px 16px;
      background: var(--card); color: var(--fg); font-size: 14px; font-weight: 850;
      box-shadow: var(--shadow-sm); transition: transform .18s ease, box-shadow .18s ease, background .18s ease;
    }
    .btn:hover { transform: translateY(-1px); box-shadow: 0 10px 24px rgba(0,0,0,.08); }
    .btn.primary { border-color: var(--primary); background: var(--primary); color: var(--primary-fg); }
    .btn.secondary { background: var(--secondary); border-color: transparent; }
    .btn.small { padding: 8px 12px; font-size: 12px; }
    .hero { display: grid; grid-template-columns: 1.25fr .75fr; gap: 44px; align-items: end; margin-bottom: 36px; }
    .hero h1 { margin: 20px 0 0; font-size: clamp(38px, 6vw, 68px); line-height: 1.02; letter-spacing: -.06em; font-weight: 1000; word-break: keep-all; }
    .lead { margin: 22px 0 0; max-width: 720px; font-size: 17px; line-height: 1.86; color: var(--muted); word-break: keep-all; }
    .summary { border: 1px solid var(--border); background: rgba(255,255,255,.86); border-radius: var(--radius-xl); padding: 20px; box-shadow: var(--shadow-sm); backdrop-filter: blur(12px); }
    .summary-title { font-size: 14px; font-weight: 900; color: var(--muted); margin-bottom: 14px; }
    .stats { display: grid; grid-template-columns: repeat(3,1fr); gap: 12px; }
    .stat { text-align: center; background: var(--secondary); border-radius: 18px; padding: 16px 8px; }
    .stat strong { display:block; font-size: 28px; line-height: 1; font-weight: 1000; letter-spacing: -.04em; }
    .stat span { display:block; margin-top: 6px; font-size: 10px; font-weight: 950; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
    .app-grid { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 20px; }
    .app-card {
      position: relative; overflow: hidden; min-height: 350px; border: 1px solid rgba(228,228,231,.85);
      border-radius: var(--radius-xl); background: var(--card); padding: 20px; box-shadow: var(--shadow-sm);
      transition: transform .22s ease, box-shadow .22s ease, border-color .22s ease;
      text-align: left;
    }
    .app-card:hover { transform: translateY(-7px); box-shadow: var(--shadow-lg); border-color: rgba(24,24,27,.13); }
    .app-card::before { content:""; position:absolute; inset:0; background: linear-gradient(135deg, var(--g1), var(--g2), var(--g3)); opacity:.86; transition: opacity .22s ease; }
    .app-card:hover::before { opacity: 1; }
    .app-card::after { content:""; position:absolute; right:-44px; top:-44px; width:154px; height:154px; border-radius:999px; background:rgba(255,255,255,.58); filter: blur(24px); }
    .app-inner { position:relative; z-index:1; height:100%; display:flex; flex-direction:column; }
    .card-top { display:flex; align-items:flex-start; justify-content:space-between; gap:16px; margin-bottom:34px; }
    .icon { width:80px; height:80px; border-radius:22px; display:grid; place-items:center; font-size:40px; border:1px solid rgba(0,0,0,.05); box-shadow: var(--shadow-sm); }
    .emerald { background:#bbf7d0; color:#047857; }
    .amber { background:#fef3c7; color:#b45309; }
    .sky { background:#dff3ff; color:#0369a1; }
    .rose { background:#ffe4e6; color:#be123c; }
    .status { border-radius:999px; background:rgba(255,255,255,.78); padding:6px 12px; font-size:12px; font-weight:900; box-shadow: var(--shadow-sm); white-space:nowrap; }
    .tag { display:inline-flex; font-size:12px; color:var(--muted); font-weight:1000; letter-spacing:.18em; text-transform:uppercase; }
    .app-card h2 { margin: 10px 0 0; font-size: 24px; line-height:1.17; letter-spacing:-.04em; font-weight:1000; word-break:keep-all; }
    .desc { margin: 14px 0 0; color:var(--muted); font-size:14px; line-height:1.72; word-break:keep-all; }
    .chips { display:flex; flex-wrap:wrap; gap:8px; margin-top:auto; padding-top:28px; }
    .chip { border-radius:999px; border:1px solid rgba(228,228,231,.72); background:rgba(255,255,255,.68); color:var(--muted); padding:6px 10px; font-size:12px; font-weight:750; }
    .open-line { display:flex; justify-content:space-between; align-items:center; border-top:1px solid rgba(228,228,231,.68); padding-top:16px; margin-top:22px; font-size:14px; font-weight:950; }
    .footer-note { margin-top: 32px; border:1px dashed var(--border); background:rgba(255,255,255,.72); border-radius: var(--radius-xl); padding: 20px; color:var(--muted); font-size:14px; line-height:1.6; }
    .footer-note strong { color: var(--fg); }
    code { background: var(--secondary); border-radius:7px; padding:2px 6px; font-size:.92em; }
    .app-page { display:grid; gap: 22px; }
    .detail-hero { overflow:hidden; border:1px solid var(--border); border-radius: var(--radius-xl); background: var(--card); box-shadow: var(--shadow-sm); }
    .detail-head { display:flex; justify-content:space-between; gap:24px; align-items:flex-start; background: linear-gradient(135deg, var(--g1), var(--g2), var(--g3)); padding: 28px; border-bottom:1px solid rgba(0,0,0,.08); color: #fff; }
    .detail-head h1 { margin: 10px 0 0; font-size: clamp(30px, 4vw, 46px); line-height:1.05; letter-spacing:-.05em; font-weight:1000; word-break:keep-all; }
    .detail-head p { margin: 14px 0 0; max-width: 760px; color: var(--muted); line-height:1.8; word-break:keep-all; }
    .detail-body { padding: 24px; }
    .notice { border:1px dashed var(--border); background:rgba(255,255,255,.76); border-radius:24px; padding:16px 18px; color:var(--muted); line-height:1.75; font-size:14px; }
    .notice strong { color: var(--fg); }
    .panel { border:1px solid var(--border); border-radius:28px; background:var(--card); box-shadow: var(--shadow-sm); overflow:hidden; }
    .panel-pad { padding: 24px; }
    .section-title { margin:0; font-size: 24px; letter-spacing:-.03em; font-weight:1000; }
    .section-sub { margin: 8px 0 0; color:var(--muted); line-height:1.65; font-size:14px; }
    .form-grid { display:grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 14px; }
    .field { display:grid; gap: 8px; }
    .field label { font-size: 12px; font-weight: 900; color: var(--muted); }
    .field input, .field select, .field textarea {
      width:100%; border:1.5px solid var(--border); border-radius:16px; background:#fff; color:var(--fg);
      padding: 12px 13px; outline:none; transition:border-color .15s ease, box-shadow .15s ease;
    }
    .field input:focus, .field select:focus, .field textarea:focus { border-color:var(--primary); box-shadow:0 0 0 3px rgba(24,24,27,.08); }
    .field textarea { min-height: 128px; resize: vertical; line-height:1.6; }
    .metric-grid { display:grid; grid-template-columns: repeat(4,minmax(0,1fr)); gap: 12px; margin: 20px 0; }
    .metric { border:1px solid var(--border); border-radius:20px; background:var(--secondary); padding: 16px; }
    .metric span { display:block; color:var(--muted); font-size:12px; font-weight:900; }
    .metric strong { display:block; margin-top:8px; font-size:22px; letter-spacing:-.04em; font-weight:1000; }
    .table-wrap { overflow:auto; border:1px solid var(--border); border-radius:20px; }
    table { width:100%; border-collapse:collapse; min-width:620px; background:#fff; }
    th, td { padding: 12px 14px; border-bottom:1px solid var(--border); text-align:left; font-size:14px; }
    th { color:var(--muted); font-size:12px; font-weight:950; background:var(--secondary); }
    tr:last-child td { border-bottom:0; }
    .row-actions { display:flex; justify-content:flex-end; gap:10px; margin-top:14px; flex-wrap:wrap; }
    .restaurant-card { border:1px solid var(--border); border-left:5px solid var(--primary); border-radius:20px; background:#fff; padding:18px; box-shadow: var(--shadow-sm); }
    .restaurant-grid { display:grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap:14px; }
    .vote-row { display:flex; gap:8px; margin-top:16px; }
    .vote-row button { flex:1; border:1px solid var(--border); background:#fff; border-radius:12px; padding:10px; font-size:12px; font-weight:850; }
    .category-row { display:flex; flex-wrap:wrap; gap:8px; }
    .category-row button { border:1px solid var(--border); background:#fff; border-radius:12px; padding:9px 12px; font-size:12px; font-weight:850; }
    .category-row button.active { background:var(--primary); color:#fff; border-color:var(--primary); }
    .iframe-shell { height: min(74vh, 760px); min-height: 560px; border:1px solid var(--border); border-radius:24px; overflow:hidden; background:#fff; }
    .iframe-shell iframe { width:100%; height:100%; border:0; background:#fff; }
    .tcg-shell { height: min(88vh, 900px); min-height: 680px; background:#04040c; }
    .workapp-shell { height: min(86vh, 940px); min-height: 700px; }
    .tcg-shell iframe { background:#04040c; }
    .empty-state { border:1px dashed var(--border); border-radius:20px; padding:28px; text-align:center; color:var(--muted); background:#fff; }
    .toast { position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:var(--primary); color:#fff; border-radius:999px; padding:12px 16px; font-size:13px; font-weight:800; box-shadow:var(--shadow-md); opacity:0; transition:opacity .18s, transform .18s; z-index:999; }
    .toast.show { opacity:1; transform:translateX(-50%) translateY(-4px); }
    @media (max-width: 1180px) { .app-grid { grid-template-columns: repeat(2,minmax(0,1fr)); } }
    @media (max-width: 900px) {
      .shell { width:min(100% - 28px, 760px); padding: 28px 0; }
      .topbar, .hero, .detail-head { grid-template-columns: 1fr; flex-direction:column; align-items:stretch; }
      .nav-actions { justify-content:flex-start; }
      .hero { display:block; }
      .summary { margin-top: 24px; }
      .form-grid, .metric-grid, .restaurant-grid { grid-template-columns: 1fr; }
    }
    @media (max-width: 640px) {
      .app-grid, .stats { grid-template-columns: 1fr; }
      .app-card { min-height: 316px; }
      .detail-head, .detail-body, .panel-pad { padding: 18px; }
      .icon { width:68px; height:68px; font-size:34px; }
    }
  </style>
</head>
<body>
  <main id="app"></main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script>
    const YOS_TCG_HTML = "<!doctype html>\n<html lang=\"ko\">\n<head>\n<meta charset=\"UTF-8\" />\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\" />\n<title>YOS TCG</title>\n<style>\n  body { margin: 0; padding: 0; font-family: Arial, sans-serif; background: #04040c; color: #fff; }\n</style>\n</head>\n<body>\n<div>Card Game</div>\n</body>\n</html>";

    const BUDGET_APP_HTML = "<!doctype html><html lang=\"ko\"><head><meta charset=\"UTF-8\"><meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\"><title>부서 회의비 관리 앱</title><style>body{margin:0;padding:20px;font-family:Arial,sans-serif;background:#f5f5f5;}</style></head><body><div>Budget App</div></body></html>";
    const RESTAURANT_APP_HTML = "<!doctype html><html lang=\"ko\"><head><meta charset=\"UTF-8\"><meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\"><title>회식 장소 추천 앱</title><style>body{margin:0;padding:20px;font-family:Arial,sans-serif;}</style></head><body><div>Restaurant Picker</div></body></html>";
let apps = [];
async function loadApps() {
  const res = await fetch("apps.json");
  apps = await res.json();
}

    const appRoot = document.getElementById("app");
    const toast = document.getElementById("toast");

    function esc(value) {
      return String(value ?? "").replace(/[&<>'"]/g, (ch) => ({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;","\"":"&quot;"}[ch]));
    }
    function showToast(message) {
      toast.textContent = message;
      toast.classList.add("show");
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => toast.classList.remove("show"), 1800);
    }
    function getCurrentSlug() {
      return location.hash.replace(/^#\/?/, "") || "home";
    }
    function setRoute(slug) {
      location.hash = slug === "home" ? "" : slug;
    }
    function appStyle(app) {
      return `--g1:${app.gradient[0]};--g2:${app.gradient[1]};--g3:${app.gradient[2]}`;
    }
    function layout(inner, options = {}) {
      const isHome = getCurrentSlug() === "home";
      return `
        <div class="shell">
          <div class="topbar">
            <a href="#" class="brand" aria-label="홈으로 이동"><span class="brand-badge">AI</span><span>Bomi's App Store</span></a>
            <div class="nav-actions">
              ${isHome ? `<span class="pill">Vibe Coding Portfolio</span>` : `<button class="btn secondary" data-action="home">← 앱 스토어로 돌아가기</button>`}
              ${options.sourceUrl ? `<a class="btn" href="${esc(options.sourceUrl)}" target="_blank" rel="noreferrer">원본 앱 보기 ↗</a>` : options.originalKey ? `<button class="btn" type="button" data-open-original="${esc(options.originalKey)}">원본 앱 보기 ↗</button>` : ""}
            </div>
          </div>
          ${inner}
        </div>
      `;
    }
    function renderHome() {
      appRoot.innerHTML = layout(`
        <section class="hero">
          <div>
            <h1>바이브 코딩으로 만든 앱들을 한곳에 모았어요.</h1>
            <p class="lead">업무에 바로 써볼 수 있는 작은 도구부터 가볍게 즐기는 게임까지, 직접 만든 프로젝트를 앱스토어처럼 둘러볼 수 있는 포트폴리오입니다.</p>
          </div>
          <aside class="summary">
            <div class="summary-title">Portfolio Summary</div>
            <div class="stats">
              <div class="stat"><strong>${apps.length}</strong><span>Archived Apps</span></div>
              <div class="stat"><strong>${apps.length}</strong><span>Playable</span></div>
              <div class="stat"><strong>100%</strong><span>Vibe-coded</span></div>
            </div>
          </aside>
        </section>
        <section class="app-grid" aria-label="AI 프로젝트 목록">
          ${apps.map(app => `
            <a class="app-card" href="#${app.slug}" style="${appStyle(app)}">
              <div class="app-inner">
                <div class="card-top"><div class="icon ${app.iconClass || ''}" style="${app.iconStyle || ''}" aria-hidden="true">${app.emoji}</div><span class="status">${app.status}</span></div>
                <span class="tag">${app.tag}</span>
${app.buildInfo && app.buildInfo.tool ? `<div style="font-size:11px;color:var(--muted);margin-top:4px;">🛠 ${app.buildInfo.tool}</div>` : ""}
                <h2>${app.title}</h2>
                <p class="desc">${app.description}</p>
                <div class="chips">${app.features.map(f => `<span class="chip">${f}</span>`).join("")}</div>
              </div>
            </a>
          `).join("")}
        </section>
      `);
    }
    function renderDetail(app, body, extraOptions = {}) {
      appRoot.innerHTML = layout(`
        <section class="app-page">
          <div class="detail-hero">
            <div class="detail-head" style="${appStyle(app)}">
              <div>
                <span class="pill">${app.tag}</span>
                <h1>${app.title}</h1>
                <p>${app.longDescription}</p>
              </div>
              <div class="icon ${app.iconClass || ''}" style="${app.iconStyle || ''}" aria-hidden="true">${app.emoji}</div>
            </div>
            <div class="detail-body">${body}</div>
          </div>
        </section>
      `, { sourceUrl: extraOptions.sourceUrl ?? app.sourceUrl, originalKey: extraOptions.originalKey ?? app.originalKey });
    }
    function setEmbeddedFrame(id, html) {
      setTimeout(() => {
        const frame = document.getElementById(id);
        if (frame) frame.srcdoc = html;
      }, 0);
    }
    function openOriginalApp(key) {
      const html = key === "meeting-budget" ? BUDGET_APP_HTML : key === "restaurant-picker" ? RESTAURANT_APP_HTML : "";
      if (!html) return;
      const win = window.open("", "_blank");
      if (!win) { showToast("팝업 차단을 해제한 뒤 다시 시도해 주세요."); return; }
      win.document.open();
      win.document.write(html);
      win.document.close();
    }
    function renderBudget() {
      const app = apps.find(a => a.slug === "meeting-budget");
      renderDetail(app, `
        <div class="panel"><div class="panel-pad">
          <div class="iframe-shell workapp-shell"><iframe id="meeting-budget-frame" title="부서 회의비 관리 앱"></iframe></div>
        </div></div>
        ${app.buildInfo && (app.buildInfo.tool || app.buildInfo.repo || app.buildInfo.notes) ? `
<div class="panel"><div class="panel-pad">
  <h2 class="section-title">🛠 제작 정보</h2>
  <div class="metric-grid" style="margin-top:14px;">
    ${app.buildInfo.tool ? `<div class="metric"><span>도구</span><strong>${app.buildInfo.tool}</strong></div>` : ""}
    ${app.buildInfo.date ? `<div class="metric"><span>시기</span><strong>${app.buildInfo.date}</strong></div>` : ""}
${app.buildInfo.repo ? `<div class="metric"><span>저장소</span><strong style="font-size:14px;">${app.buildInfo.repo}</strong></div>` : ""}
${app.buildInfo.deploy ? `<div class="metric"><span>배포</span><strong style="font-size:14px;">${app.buildInfo.deploy}</strong></div>` : ""}  </div>
  ${app.buildInfo.stack && app.buildInfo.stack.length ? `<div class="chips" style="padding-top:14px;margin-top:0;">${app.buildInfo.stack.map(s => `<span class="chip">${s}</span>`).join("")}</div>` : ""}
  ${app.buildInfo.notes ? `<p class="section-sub" style="margin-top:14px;">${app.buildInfo.notes}</p>` : ""}
</div></div>
` : ""}
      `);
      setEmbeddedFrame("meeting-budget-frame", BUDGET_APP_HTML);
    }
    function renderRestaurant() {
      const app = apps.find(a => a.slug === "restaurant-picker");
      renderDetail(app, `
        <div class="panel"><div class="panel-pad">
          <div class="iframe-shell workapp-shell"><iframe id="restaurant-picker-frame" title="회식 장소 추천 앱"></iframe></div>
        </div></div>
        ${app.buildInfo && (app.buildInfo.tool || app.buildInfo.repo || app.buildInfo.notes) ? `
<div class="panel"><div class="panel-pad">
  <h2 class="section-title">🛠 제작 정보</h2>
  <div class="metric-grid" style="margin-top:14px;">
    ${app.buildInfo.tool ? `<div class="metric"><span>도구</span><strong>${app.buildInfo.tool}</strong></div>` : ""}
    ${app.buildInfo.date ? `<div class="metric"><span>시기</span><strong>${app.buildInfo.date}</strong></div>` : ""}
    ${app.buildInfo.repo ? `<div class="metric"><span>저장소</span><strong style="font-size:14px;">${app.buildInfo.repo}</strong></div>` : ""}
${app.buildInfo.deploy ? `<div class="metric"><span>배포</span><strong style="font-size:14px;">${app.buildInfo.deploy}</strong></div>` : ""}  </div>
  ${app.buildInfo.stack && app.buildInfo.stack.length ? `<div class="chips" style="padding-top:14px;margin-top:0;">${app.buildInfo.stack.map(s => `<span class="chip">${s}</span>`).join("")}</div>` : ""}
  ${app.buildInfo.notes ? `<p class="section-sub" style="margin-top:14px;">${app.buildInfo.notes}</p>` : ""}
</div></div>
` : ""}
      `);
      setEmbeddedFrame("restaurant-picker-frame", RESTAURANT_APP_HTML);
    }
    function renderCardGame() {
      const app = apps.find(a => a.slug === "casual-card-game");
      renderDetail(app, `
        <div class="panel"><div class="panel-pad">
          <div class="iframe-shell tcg-shell"><iframe id="yos-tcg-frame" title="YOS TCG"></iframe></div>
        </div></div>
        ${app.buildInfo && (app.buildInfo.tool || app.buildInfo.repo || app.buildInfo.notes) ? `
<div class="panel"><div class="panel-pad">
